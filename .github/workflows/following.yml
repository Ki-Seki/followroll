name: Following
# A run started by a repost says so in the list of runs: "Repost created"
run-name: ${{ github.event_name == 'discussion' && format('Repost {0}', github.event.action) || '' }}

on:
  # Every six hours, at minute 23
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
  # A repost is a discussion in this repository, so the page is rebuilt when
  # one is started, changed or deleted. GitHub reports other things about a
  # discussion too, more than one of them when it is started; none of those
  # changes what was reposted.
  discussion:
    types: [created, edited, deleted]

permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write
  # Lets the last step keep this schedule from being switched off
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Anyone can start a discussion here; only the owner's own start a run.
    if: github.event_name != 'discussion' || contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.discussion.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect posts and build the page
        # Options are repository variables (Settings → Secrets and variables →
        # Actions → Variables), so a fork never has to edit this file and can
        # always sync with upstream. Unset ones fall back to their defaults.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FOLLOWING_LOGIN: ${{ vars.FOLLOWING_LOGIN }}
          FOLLOWING_TITLE: ${{ vars.FOLLOWING_TITLE }}
          FOLLOWING_MAX_PEOPLE: ${{ vars.FOLLOWING_MAX_PEOPLE }}
          FOLLOWING_DISCOVER: ${{ vars.FOLLOWING_DISCOVER }}
          # Optional: with this secret set, posts are translated (see the README)
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: python3 following.py --output _site
      - uses: actions/upload-pages-artifact@v3
      - name: Keep the schedule alive
        # GitHub switches a schedule off after 60 days without repository
        # activity; enabling the workflow again resets that clock.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/following.yml/enable" --silent \
            || echo "::notice::Could not re-enable the workflow; if the schedule stops, turn it back on from the Actions tab."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
